version: 1
journeys:
- id: organic-demo
  channel: organic
  description: Synthetic attribution transport test; does not prove advertising-platform
    attribution.
  browser:
    path: /demo
    query: {}
    steps:
    - action: click
      selector: '[data-qa="consent-accept"]'
    - action: fill
      selector: '[name="email"]'
      value: ${QA_TEST_EMAIL}
    - action: click
      selector: '[type="submit"]'
    - action: wait_visible
      selector: '[data-qa="success"]'
    settle_ms: 500
    referrer: https://www.google.com/
  expectations:
  - id: browser-lead
    source: browser
    event: generate_lead
    min_count: 1
    max_count: 1
    deadline_seconds: 120
    fields: {}
    required_fields:
    - submission_id
  - id: network-lead
    source: network
    event: generate_lead
    min_count: 1
    max_count: 1
    deadline_seconds: 120
    fields: {}
    required_fields:
    - submission_id
  - id: ga4-lead
    source: ga4
    event: generate_lead
    min_count: 1
    max_count: 1
    deadline_seconds: 172800
    fields: {}
    required_fields:
    - submission_id
  - id: crm-submission
    source: hubspot
    event: submission
    min_count: 1
    max_count: 1
    deadline_seconds: 120
    fields: {}
    required_fields:
    - submission_id
  - id: crm-contact
    source: hubspot
    event: contact
    min_count: 1
    max_count: 1
    deadline_seconds: 120
    fields:
      lifecyclestage: lead
    required_fields:
    - submission_id
  correlate_by:
  - submission_id
