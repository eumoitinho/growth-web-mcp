- id: whatsapp-to-crm
  channel: messaging
  description: Supply evidence from the messaging integration. A click alone is not
    a conversation or lead.
  expectations:
  - id: click
    source: browser
    event: ctw_click
    min_count: 1
    max_count: 1
    deadline_seconds: 120
    fields: {}
  - id: conversation
    source: messaging
    event: conversation_started
    min_count: 1
    max_count: 1
    deadline_seconds: 600
    fields: {}
  - id: contact
    source: hubspot
    event: contact
    min_count: 1
    max_count: 1
    deadline_seconds: 600
    fields: {}
- id: lead-ads-to-crm
  channel: paid_social
  description: Use platform test leads and an integration evidence adapter; no website
    event expected.
  expectations:
  - id: platform-lead
    source: meta
    event: lead_received
    min_count: 1
    max_count: 1
    deadline_seconds: 600
    fields: {}
  - id: contact
    source: hubspot
    event: contact
    min_count: 1
    max_count: 1
    deadline_seconds: 600
    fields: {}
  - id: website
    source: ga4
    event: generate_lead
    min_count: 0
    max_count: 0
    deadline_seconds: 120
    fields: {}
    applicable: false
