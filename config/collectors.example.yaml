# Copy to collectors.local.yaml and configure only your test accounts.
hubspot:
  token_env: QA_HUBSPOT_TOKEN
  properties: [test_run_id, submission_id, utm_source, utm_medium, utm_campaign, lifecyclestage, hubspot_owner_id]
  form_ids: []  # Required to verify submissions separately from contacts.
  max_pages: 20
ga4:
  project: your-test-project
  table: your-test-project.growth_clean.stg_events
  location: US
  maximum_bytes_billed: 100000000
  timeout_seconds: 60
