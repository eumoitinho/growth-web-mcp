# Builds and pushes every MCP server image in parallel.
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=southamerica-east1,_TAG=$(git rev-parse --short HEAD)
substitutions:
  _REGION: southamerica-east1
  _REPO: growth-mcp
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: ga4
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ga4:${_TAG}", "servers/ga4"]
  - id: google-ads
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/google-ads:${_TAG}", "servers/google-ads"]
  - id: gtm
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gtm:${_TAG}", "servers/gtm"]
  - id: hubspot
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hubspot:${_TAG}", "servers/hubspot"]
  - id: site-browser
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/site-browser:${_TAG}", "servers/site-browser"]
  - id: meta
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/meta:${_TAG}", "servers/meta"]

  - id: gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}", "servers/gateway"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ga4:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/google-ads:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gtm:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hubspot:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/site-browser:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/meta:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}
